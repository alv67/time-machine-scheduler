name: Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: ${{ !contains(github.event.issue.labels.*.name, 'triage') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label triage
